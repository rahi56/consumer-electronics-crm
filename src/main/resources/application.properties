
# ========================================
# MySQL Database Configuration
# ========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


# ========================================
# JWT Configuration
# ========================================
app.jwt.secret=${JWT_SECRET:RFe2xZdAODgKpHxRZ+7lPB/k5nIpkjewlviE1CCPhfw=}
app.jwt.expiration=3600000


# Initial ADMIN bootstrap
app.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap-admin.name=${ADMIN_NAME:}
app.bootstrap-admin.username=${ADMIN_USERNAME:}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

